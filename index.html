<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live Weather</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <div id="loader" style="display:none; text-align:center; color:white;">
  <h4>Loading...</h4>
</div>
    <div class="searchBar">
        <div class="searchBarParentDiv">
            <input type="text" class="inputfield" placeholder="Search City">
            <img src="./search.png" alt="" width="35px" class="searchIcon" onclick="fetchData()">
        </div>
    </div>
    <div class="mainContentParentDiv d-flex">
        <div class="leftDiv">
            <div class="currentTempDiv leftChild p-3 d-flex flex-column gap-2">
                <h6 class="m-0" id="cityName">City Name</h6>
                <h5 class="m-0"> <span id="cityTemp">-</span> &deg;C</h5>
                <h6 class="m-0" id="skyDesc">Sky Description</h6>
                <hr class="line">
                <div class="d-flex gap-2">
                    <img src="./calendar.png" alt="" width="25px">
                    <h6 class="m-0" id="date">Date</h6>
                </div>
                <div class="d-flex gap-2">
                    <img src="./time.png" alt="" width="25px">
                    <h6 class="m-0" id="time">Time</h6>
                </div>
            </div>


            <div class="nextFiveDays leftChild p-3 d-flex flex-column gap-2">
                <h6 class="m-0" id="comingFiveDaysTitle">Coming 5 Days</h6>
                <div id="forecastContainer" class="d-flex flex-column gap-1"></div>
            </div>
        </div>


        <div class="rightDiv">
            <div class="rightRow rowOne d-flex gap-2 justify-content-between align-items-center">

                <div class="extraMetric d-flex gap-3">
                    <img src="./flood.png" alt="" width="35px">
                    <div>
                        <h6 class="m-0">Humidity</h6>
                        <h6 class="m-0" id="humidity">-</h6>
                    </div>
                </div>
                <div class="extraMetric d-flex gap-3">
                    <img src="./wind (1).png" alt="" width="35px">
                    <div>
                        <h6 class="m-0">Pressure</h6>
                        <h6 class="m-0" id="pressure">-</h6>
                    </div>
                </div>
                <div class="extraMetric d-flex gap-3">
                    <img src="./hot.png" alt="" width="35px">
                    <div>
                        <h6 class="m-0">Feels like</h6>
                        <h6 class="m-0" id="feelsLike">-</h6>
                    </div>
                </div>
                <div class="extraMetric d-flex gap-3">
                    <img src="./eye.png" alt="" width="35px">
                    <div>
                        <h6 class="m-0">Visibility</h6>
                        <h6 class="m-0" id="visiblity">-</h6>
                    </div>
                </div>

            </div>

            <div class="rightRow rowTwo d-flex justify-content-between align-items-center">
                <div class="AQI rowTwoDiv p-3 d-flex flex-column gap-2">
                    <h5>Air Quality Index (AQI)</h5>

                    <div class="d-flex align-items-center justify-content-between">
                        <img src="./wind.png" alt="" width="40px">
                        <div class="text-center">
                            <h6 id="co">CO</h6>
                            <h6 id="coValue">-</h6>
                        </div>
                        <div class="text-center">
                            <h6 id="so2">SO2</h6>
                            <h6 id="so2Value">-</h6>
                        </div>
                        <div class="text-center">
                            <h6 id="o3">O3</h6>
                            <h6 id="o3Value">-</h6>
                        </div>
                        <div class="text-center">
                            <h6 id="no2">NO2</h6>
                            <h6 id="no2Value">-</h6>
                        </div>
                    </div>
                </div>

                <div class="sunRise rowTwoDiv p-3 gap-2">
                    <h5 class="m-0">Sunrise & Sunset</h5>

                    <div class="d-flex justify-content-between">
                        <div class="sunriseDiv d-flex gap-2 align-items-center">
                            <img src="./sun (1).png" alt="" width="75px">
                            <div class="d-flex flex-column gap-1">
                                <h6 class="m-0">Sunrise</h6>
                                <h5 class="m-0" id="sunriseTime">-:-- Am</h5>
                            </div>
                        </div>

                        <div class="sunsetDiv d-flex gap-2 align-items-center">
                            <img src="./moon.png" alt="" width="65px">
                            <div class="d-flex flex-column gap-2">
                                <h6 class="m-0">Sunset</h6>
                                <h5 class="m-0" id="sunsetTime">-:-- Pm</h5>
                            </div>

                        </div>
                    </div>

                </div>

            </div>

            <div class="rightRow rowThree d-flex flex-column gap-2">
                <h5 class="m-0">Today</h5>
                <div class="d-flex justify-content-between todayTempParentDiv" id="todayTempContainer">
                   
                </div>
            </div>

        </div>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>

    <script>

function dateFormat(timestamp) {
    const date = new Date(timestamp * 1000);
    return date.toLocaleString();
}

const API_KEY = "df0af9684890b470157226838a4ac9a4"; 

// 🔍 ENTER KEY SEARCH
document.querySelector(".inputfield").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        fetchData();
    }
});

// ⏳ LOADER FUNCTIONS
function showLoader() {
    document.body.style.opacity = "0.5";
}

function hideLoader() {
    document.body.style.opacity = "1";
}

// 🌫️ AQI
async function fetchAQIData(lat, lon) {
    let res = await fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${API_KEY}`);
    let data = await res.json();

    let list = data.list[0].components;

    $("#no2Value")[0].innerText = list.no2;
    $("#o3Value")[0].innerText = list.o3;
    $("#coValue")[0].innerText = list.co;
    $("#so2Value")[0].innerText = list.so2;
}

// 📅 5 DAYS
async function nextFiveDays(lat, lon) {
    let res = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`);
    let data = await res.json();

    let daily = {};
    data.list.forEach(item => {
        let date = item.dt_txt.split(" ")[0];
        if (!daily[date]) {
            daily[date] = {
                temp: item.main.temp.toFixed(1),
                day: new Date(date).toLocaleDateString('en-US', { weekday: 'long' })
            };
        }
    });

    let html = "";
    Object.keys(daily).slice(0, 5).forEach(date => {
        html += `
        <div class="d-flex justify-content-between p-2" style="border-bottom:1px solid rgba(255,255,255,0.2)">
            <h6>${daily[date].day}</h6>
            <h6>${daily[date].temp}°C</h6>
        </div>`;
    });

    document.getElementById("forecastContainer").innerHTML = html;
}

// ⏰ TODAY TEMPS
async function todayTemps(lat, lon) {
    let res = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`);
    let data = await res.json();

    let html = "";

    data.list.slice(0, 6).forEach(item => {
        let time = new Date(item.dt_txt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        html += `
        <div class="todayTemp text-center p-2" style="background:rgba(255,255,255,0.1); border-radius:10px;">
            <h6>${time}</h6>
            <h5>${item.main.temp.toFixed(1)}°C</h5>
        </div>`;
    });

    document.getElementById("todayTempContainer").innerHTML = html;
}

// 🌦️ MAIN FUNCTION
async function fetchData() {

    let city = document.querySelector(".inputfield").value;

    if (!city) {
        alert("Please enter city name");
        return;
    }

    showLoader();

    let res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`);
    let data = await res.json();

    if (!data.main) {
        alert("Invalid city or API issue");
        hideLoader();
        return;
    }

    // 🎨 DYNAMIC BACKGROUND
    let condition = data.weather && data.weather[0] && data.weather[0].main;

console.log("Weather condition:", condition);

if (condition === "Clear") {
  document.body.style.background = "linear-gradient(to right, #f7971e, #ffd200)";
} 
else if (condition === "Clouds") {
  document.body.style.background = "linear-gradient(to right, #757f9a, #d7dde8)";
} 
else if (condition === "Rain" || condition === "Drizzle") {
  document.body.style.background = "linear-gradient(to right, #314755, #26a0da)";
} 
else if (condition === "Haze" || condition === "Mist" || condition === "Smoke" || condition === "Dust") {
  document.body.style.background = "linear-gradient(to right, #3E5151, #DECBA4)";
} 
else {
  document.body.style.background = "#222";
}
    $("#cityName")[0].innerText = data.name;
    $("#cityTemp")[0].innerText = data.main.temp.toFixed(1);
    let emoji = "";

if (condition === "Clear") emoji = "☀️";
else if (condition === "Clouds") emoji = "☁️";
else if (condition === "Rain") emoji = "🌧️";
else if (condition === "Haze" || condition === "Mist") emoji = "🌫️";

$("#skyDesc")[0].innerText = emoji + " " + data.weather[0].description;

    $("#humidity")[0].innerText = data.main.humidity;
    $("#pressure")[0].innerText = data.main.pressure;
    $("#feelsLike")[0].innerText = data.main.feels_like;
    $("#visiblity")[0].innerText = data.visibility;

    let properDate = dateFormat(data.dt);
    $("#date")[0].innerText = properDate.split(",")[0];
    $("#time")[0].innerText = properDate.split(",")[1];

    $("#sunriseTime")[0].innerText = dateFormat(data.sys.sunrise).split(",")[1];
    $("#sunsetTime")[0].innerText = dateFormat(data.sys.sunset).split(",")[1];

    let lat = data.coord.lat;
    let lon = data.coord.lon;

    fetchAQIData(lat, lon);
    nextFiveDays(lat, lon);
    todayTemps(lat, lon);

    hideLoader();
}

</script>


</body>

</html>
